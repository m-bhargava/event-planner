version: 0.2

env:
  variables:
    REACT_APP_NAME: "event-planner"
    DEPLOY_USER: "ec2-user"
    APP_PORT: "3000"
  secrets-manager:
    EC2_SSH_KEY: "EC2_SSH_PRIVATE_KEY"
    EC2_PUBLIC_IP: "EC2_PUBLIC_IP"

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - npm install
      - echo "Installing OWASP ZAP..."
      - sudo apt-get update && sudo apt-get install -y zaproxy

  pre_build:
    commands:
      - echo "Running Unit Tests..."
      - npm test || echo "Tests failed. Proceeding with security scan."

  build:
    commands:
      - echo "Building React App..."
      - npm run build

  post_build:
    commands:
      - echo "Starting OWASP ZAP Security Scan..."
      - zap-cli quick-scan --self-contained --start-options '-config api.disablekey=true' https://your-deployed-react-app-url
      - echo "Generating OWASP ZAP report..."
      - mkdir -p reports
      - zap-cli report -o reports/zap-report.html -f html
      - echo "Security scan completed."

      # Deploy to EC2 using SCP
      - echo "Configuring SSH Key..."
      - mkdir -p ~/.ssh
      - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-keyscan -H $EC2_PUBLIC_IP >> ~/.ssh/known_hosts

      - echo "Deploying to EC2 instance..."
      - scp -r build/ $DEPLOY_USER@$EC2_PUBLIC_IP:/home/$DEPLOY_USER/$REACT_APP_NAME

      - echo "Starting app with PM2..."
      - ssh $DEPLOY_USER@$EC2_PUBLIC_IP "
          cd /home/$DEPLOY_USER/$REACT_APP_NAME &&
          npm install &&
          pm2 stop $REACT_APP_NAME || true &&
          pm2 start 'npx serve -s build -l $APP_PORT' --name $REACT_APP_NAME
        "

artifacts:
  files:
    - reports/zap-report.html
    - '**/*'
  base-directory: build
  discard-paths: no
