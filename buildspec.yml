version: 0.2

env:
  variables:
    REACT_APP_NAME: "event-planner"
    DEPLOY_USER: "ec2-user"
    APP_PORT: "3000"
    EC2_PUBLIC_IP: "16.171.199.57"

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - npm install
      - echo "Installing OWASP ZAP..."
      - |
        if command -v apt-get > /dev/null; then
          echo "Using apt-get";
          sudo apt-get update && sudo apt-get install -y zaproxy;
        elif command -v yum > /dev/null; then
          echo "Using yum";
          sudo yum install -y java-1.8.0-openjdk;
          curl -L https://github.com/zaproxy/zaproxy/releases/download/v2.14.0/ZAP_2.14.0_Linux.tar.gz -o zap.tar.gz;
          tar -xzf zap.tar.gz;
          sudo mv ZAP_2.14.0 /opt/zaproxy;
          echo "export PATH=$PATH:/opt/zaproxy" >> ~/.bashrc;
          source ~/.bashrc;
        else
          echo "No supported package manager found!";
          exit 1;
        fi

  pre_build:
    commands:
      - echo "Running Unit Tests..."
      - npm test || echo "Tests failed. Proceeding with security scan."

  build:
    commands:
      - echo "Building React App..."
      - npm run build

  post_build:
    commands:
      - echo "Starting OWASP ZAP Security Scan..."
      - zap-cli quick-scan --self-contained --start-options '-config api.disablekey=true' https://your-deployed-react-app-url
      - echo "Generating OWASP ZAP report..."
      - mkdir -p reports
      - zap-cli report -o reports/zap-report.html -f html
      - echo "Security scan completed."

      # Deploy to EC2 using SSM (No SSH Key)
      - echo "Deploying to EC2 instance via SSM..."
      - aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --targets "[{\"Key\":\"InstanceIds\",\"Values\":[\"$EC2_INSTANCE_ID\"]}]" \
          --parameters 'commands=[
              "cd /home/ec2-user",
              "rm -rf $REACT_APP_NAME",
              "mkdir $REACT_APP_NAME",
              "cd $REACT_APP_NAME",
              "aws s3 cp s3://your-s3-bucket-name/build.zip .",
              "unzip build.zip",
              "npm install",
              "pm2 stop $REACT_APP_NAME || true",
              "pm2 start 'npx serve -s build -l $APP_PORT' --name $REACT_APP_NAME"
          ]'

artifacts:
  files:
    - reports/zap-report.html
    - '**/*'
  base-directory: build
  discard-paths: no
